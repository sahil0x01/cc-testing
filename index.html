<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prefill Todos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Prefill Todos</h1>

      <form id="new-todo-form" class="new-todo" autocomplete="off">
        <input
          id="new-todo-input"
          class="new-todo-input"
          type="text"
          placeholder="What needs doing?"
          aria-label="New todo"
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <div class="search">
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search todos..."
          aria-label="Search todos"
          autocomplete="off"
        />
        <button type="button" id="search-clear" class="btn" hidden>Clear</button>
      </div>

      <div class="sort">
        <label class="sort-label" for="sort-select">Sort</label>
        <select id="sort-select" class="sort-select" aria-label="Sort todos">
          <option value="created-asc" selected>Created · oldest</option>
          <option value="created-desc">Created · newest</option>
          <option value="updated-desc">Updated · newest</option>
          <option value="updated-asc">Updated · oldest</option>
        </select>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty-state">Nothing to do yet.</p>
      <p id="todo-count" class="todo-count"></p>

      <div class="bulk">
        <button type="button" id="clear-all" class="btn btn-danger" hidden>Clear all</button>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
